<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#18202a}#app{height:100%;display:flex;flex-direction:column}.top{height:62px;flex:none;background:#101827;color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:1000}.brand{font-weight:800;letter-spacing:.4px;white-space:nowrap}.status{font-size:12px;opacity:.7}.spacer{flex:1}.btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.primary{background:#2563eb;color:#fff}.btn.light{background:#fff;color:#172033}.btn:disabled{opacity:.55;cursor:not-allowed}.layout{flex:1;min-height:0;display:flex}.side{width:370px;flex:none;background:#fff;border-right:1px solid #dfe4ec;display:flex;flex-direction:column;z-index:900}.search{padding:13px;border-bottom:1px solid #e5e7eb}.search input{width:100%;padding:12px;border:1px solid #cfd6e2;border-radius:10px;outline:none}.hint{font-size:12px;color:#64748b;margin-top:7px}.list{overflow:auto;flex:1;padding:8px}.card{border:1px solid #e1e7ef;border-radius:11px;padding:11px;margin-bottom:7px;cursor:pointer;background:#fff}.card:hover{border-color:#2563eb}.card h3{font-size:14px;margin:0 0 5px}.muted{color:#64748b;font-size:12px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8eefc;color:#1d4ed8;font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:6px}.empty{padding:24px;text-align:center;color:#64748b;font-size:13px}.mapwrap{flex:1;min-width:0;position:relative}.map{height:100%;width:100%}.floating{position:absolute;top:13px;right:13px;z-index:800;background:#fff;border-radius:11px;box-shadow:0 5px 22px #0002;padding:8px;display:flex;gap:7px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:2000;padding:18px}.modal.open{display:flex}.dialog{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:16px;box-shadow:0 20px 70px #0005;padding:20px}.dialog h2{margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#475569}.field input,.field select,.field textarea{border:1px solid #cfd6e2;border-radius:9px;padding:10px}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.close{float:right;border:0;background:#eef2f7;border-radius:8px;padding:6px 9px;cursor:pointer}.account{font-size:12px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast{position:fixed;bottom:18px;right:18px;background:#111827;color:#fff;padding:12px 15px;border-radius:10px;z-index:3000;display:none;max-width:380px}.leaflet-popup-content-wrapper{border-radius:12px}.popup h3{margin:0 0 6px}.popup p{margin:4px 0;font-size:12px}.smallbtn{border:0;background:#2563eb;color:#fff;border-radius:7px;padding:6px 9px;cursor:pointer;margin-top:7px}.marker-cluster{font-weight:800}.marker-cluster-small{background:rgba(37,99,235,.18)}.marker-cluster-small div{background:#2563eb;color:#fff}.marker-cluster-medium{background:rgba(37,99,235,.2)}.marker-cluster-medium div{background:#1d4ed8;color:#fff}.marker-cluster-large{background:rgba(30,64,175,.22)}.marker-cluster-large div{background:#1e40af;color:#fff}@media(max-width:700px){.layout{flex-direction:column}.side{width:100%;height:42%;border-right:0;border-bottom:1px solid #dfe4ec}.mapwrap{height:58%}.account{display:none}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div id="app"><header class="top"><div class="brand">FBK KAUNAS LOGISTICS</div><div class="status" id="status">Connecting…</div><div class="spacer"></div><div class="account" id="account"></div><button class="btn light" id="authBtn">Sign in</button><button class="btn primary" id="addBtn">+ Add Facility</button></header><div class="layout"><aside class="side"><div class="search"><input id="search" placeholder="Search facility name or address…" autocomplete="off"><div class="hint" id="searchHint">Search is optimized for large facility lists.</div></div><div class="list" id="list"><div class="empty">Loading facilities…</div></div></aside><main class="mapwrap"><div id="map" class="map"></div><div class="floating"><button class="btn light" id="usaBtn">🇺🇸 USA</button><button class="btn primary" id="locateBtn">◎ My location</button></div></main></div></div>
<div class="modal" id="facilityModal"><div class="dialog"><button class="close" data-close="facilityModal">✕</button><h2>Add shipping / receiving facility</h2><form id="facilityForm"><div class="grid"><div class="field full"><label>Facility name *</label><input name="name" required placeholder="Example: Walmart Distribution Center"></div><div class="field"><label>Type *</label><select name="facility_type"><option value="shipper">Shipper</option><option value="receiver">Receiver</option><option value="both">Shipper + Receiver</option></select></div><div class="field"><label>ZIP</label><input name="zip" placeholder="75001"></div><div class="field full"><label>Street address *</label><input name="address" required placeholder="123 Main St"></div><div class="field"><label>City</label><input name="city" placeholder="Dallas"></div><div class="field"><label>State</label><input name="state_code" maxlength="2" placeholder="TX"></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Hours</label><input name="hours" placeholder="Mon-Fri 06:00-22:00"></div><div class="field"><label>Parking</label><input name="parking"></div><div class="field"><label>Lumper</label><input name="lumper"></div><div class="field"><label>Appointment</label><input name="appointment"></div><div class="field"><label>Average wait (min)</label><input name="average_wait_minutes" type="number" min="0"></div><div class="field full"><label>Driver notes</label><textarea name="driver_instructions" placeholder="Gate instructions, check-in, dock info, important driver notes…"></textarea></div></div><div class="actions"><button type="button" class="btn light" data-close="facilityModal">Cancel</button><button class="btn primary" type="submit">Save facility</button></div></form></div></div>
<div class="modal" id="authModal"><div class="dialog"><button class="close" data-close="authModal">✕</button><h2 id="authTitle">Sign in</h2><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div class="actions"><button type="button" class="btn light" id="toggleAuth">Create account</button><button class="btn primary" type="submit" id="authSubmit">Sign in</button></div></form><div class="hint">Accounts are optional for browsing and adding public facilities.</div></div></div><div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ynjfvtezearvynmvmmvo.supabase.co',SUPABASE_KEY='sb_publishable_QW_rJUJ_8XrTytm4aUbbaw_397_7H0t',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);let facilities=[],facilityById=new Map(),markers=new Map(),currentUser=null,authMode='login',searchTimer=null,lastSearchToken=0;
const map=L.map('map',{preferCanvas:true,zoomAnimation:true,fadeAnimation:true,markerZoomAnimation:true}).setView([39.8,-98.6],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,updateWhenZooming:false,updateWhenIdle:true,keepBuffer:1,attribution:'© OpenStreetMap contributors'}).addTo(map);
const markerIcon=L.divIcon({className:'',html:'<div style="width:14px;height:14px;background:#2563eb;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 5px #0006"></div>',iconSize:[14,14],iconAnchor:[7,7]});const cluster=L.markerClusterGroup({chunkedLoading:true,chunkInterval:40,chunkDelay:20,removeOutsideVisibleBounds:true,animateAddingMarkers:false,maxClusterRadius:55,disableClusteringAtZoom:15,spiderfyOnMaxZoom:true,showCoverageOnHover:false,zoomToBoundsOnClick:true});map.addLayer(cluster);
function toast(msg,good=true){const t=$('toast');t.textContent=msg;t.style.background=good?'#111827':'#991b1b';t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',4000)}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function address(f){return [f.address,f.city,f.state_code,f.zip].filter(Boolean).join(', ')}function typeLabel(t){return t==='both'?'Shipper + Receiver':(t||'').charAt(0).toUpperCase()+(t||'').slice(1)}
function popup(f){return `<div class="popup"><h3>${esc(f.name)}</h3><p><b>${esc(typeLabel(f.facility_type))}</b></p><p>${esc(address(f))}</p>${f.phone?`<p>☎ ${esc(f.phone)}</p>`:''}${f.hours?`<p>Hours: ${esc(f.hours)}</p>`:''}${f.parking?`<p>Parking: ${esc(f.parking)}</p>`:''}${f.lumper?`<p>Lumper: ${esc(f.lumper)}</p>`:''}${f.appointment?`<p>Appointment: ${esc(f.appointment)}</p>`:''}${f.average_wait_minutes!=null?`<p>Avg wait: ${esc(f.average_wait_minutes)} min</p>`:''}${f.driver_instructions?`<p><b>Driver notes:</b> ${esc(f.driver_instructions)}</p>`:''}<button class="smallbtn" onclick="focusFacility('${f.id}')">Open facility</button></div>`}
function makeMarker(f){if(!Number.isFinite(+f.latitude)||!Number.isFinite(+f.longitude))return null;const m=L.marker([+f.latitude,+f.longitude],{icon:markerIcon}).bindPopup(popup(f),{maxWidth:330,autoPan:true});markers.set(f.id,m);return m}function addMarkers(rows){const batch=[];for(const f of rows){facilityById.set(f.id,f);if(!markers.has(f.id)){const m=makeMarker(f);if(m)batch.push(m)}}if(batch.length)cluster.addLayers(batch)}
function renderList(rows,countLabel){const list=$('list'),limited=rows.slice(0,80);list.innerHTML=limited.length?limited.map(f=>`<div class="card" data-id="${esc(f.id)}"><span class="pill">${esc(typeLabel(f.facility_type))}</span><h3>${esc(f.name)}</h3><div class="muted">${esc(address(f))}</div>${f.driver_instructions?`<div class="muted" style="margin-top:6px">${esc(f.driver_instructions.slice(0,100))}${f.driver_instructions.length>100?'…':''}</div>`:''}</div>`).join(''):'<div class="empty">No facilities found.</div>';list.querySelectorAll('.card').forEach(el=>el.onclick=()=>focusFacility(el.dataset.id));$('searchHint').textContent=countLabel||(rows.length>80?`Showing 80 of ${rows.length} results.`:`${rows.length} result${rows.length===1?'':'s'}.`)}
function focusFacility(id){const f=facilityById.get(id);if(!f)return;if(!Number.isFinite(+f.latitude)||!Number.isFinite(+f.longitude)){toast('This facility does not have coordinates yet.',false);return}map.flyTo([+f.latitude,+f.longitude],16,{duration:.55,easeLinearity:.25});const m=markers.get(id);if(m)setTimeout(()=>m.openPopup(),600)}window.focusFacility=focusFacility;
async function loadFacilities(){$('status').textContent='Loading map data…';const select='id,name,facility_type,address,city,state_code,zip,phone,hours,parking,lumper,appointment,average_wait_minutes,driver_instructions,latitude,longitude,public_visible,created_at';const {data,error}=await db.from('facilities').select(select).eq('public_visible',true).order('name').range(0,9999);if(error){console.error(error);$('status').textContent='Database error';toast('Could not load facilities: '+error.message,false);$('list').innerHTML='<div class="empty">Database connection failed.</div>';return}facilities=data||[];facilityById=new Map(facilities.map(f=>[f.id,f]));addMarkers(facilities);renderList(facilities,`${facilities.length} facilities loaded — map markers are clustered for smooth performance.`);$('status').textContent=`${facilities.length} facilities`}
async function searchFacilities(q){const token=++lastSearchToken;q=q.trim();if(!q){renderList(facilities,`${facilities.length} facilities loaded — map markers are clustered for smooth performance.`);return}const local=facilities.filter(f=>[f.name,address(f),f.city,f.state_code,f.zip,f.facility_type].join(' ').toLowerCase().includes(q.toLowerCase()));renderList(local,'Searching all facilities…');try{const pattern=`%${q.replace(/[%_,]/g,' ')}%`;const {data,error}=await db.from('facilities').select('id,name,facility_type,address,city,state_code,zip,phone,hours,parking,lumper,appointment,average_wait_minutes,driver_instructions,latitude,longitude,public_visible,created_at').eq('public_visible',true).or(`name.ilike.${pattern},address.ilike.${pattern},city.ilike.${pattern},state_code.ilike.${pattern},zip.ilike.${pattern}`).order('name').limit(100);if(token!==lastSearchToken)return;if(error){console.error(error);return}const remote=data||[],merged=new Map(local.map(f=>[f.id,f]));remote.forEach(f=>merged.set(f.id,f));const rows=[...merged.values()];rows.forEach(f=>facilityById.set(f.id,f));addMarkers(rows);renderList(rows,`${rows.length} result${rows.length===1?'':'s'} found.`)}catch(e){console.error(e)}}
$('search').oninput=e=>{clearTimeout(searchTimer);const q=e.target.value;searchTimer=setTimeout(()=>searchFacilities(q),180)};$('usaBtn').onclick=()=>map.flyTo([39.8,-98.6],4,{duration:.55});$('locateBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>map.flyTo([p.coords.latitude,p.coords.longitude],13),()=>toast('Location permission was not granted.',false)):toast('Geolocation is not available.',false);
$('addBtn').onclick=()=>{$('facilityModal').classList.add('open');$('facilityForm').reset()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('open'));window.onclick=e=>{if(e.target.classList.contains('modal'))e.target.classList.remove('open')};
async function geocode(query){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(query),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('Geocoding service unavailable');const a=await r.json();if(!a.length)throw new Error('Address not found. Enter a more complete US address.');return{lat:+a[0].lat,lon:+a[0].lon}}
$('facilityForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries()),btn=e.target.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Finding address…';try{const g=await geocode([v.address,v.city,v.state_code,v.zip,'USA'].filter(Boolean).join(', '));const row={name:v.name.trim(),facility_type:v.facility_type,address:v.address.trim(),city:v.city?.trim()||null,state_code:v.state_code?.trim().toUpperCase()||null,zip:v.zip?.trim()||null,phone:v.phone?.trim()||null,hours:v.hours?.trim()||null,parking:v.parking?.trim()||null,lumper:v.lumper?.trim()||null,appointment:v.appointment?.trim()||null,average_wait_minutes:v.average_wait_minutes?Number(v.average_wait_minutes):null,driver_instructions:v.driver_instructions?.trim()||null,latitude:g.lat,longitude:g.lon,public_visible:true,created_by:currentUser?.id||null,organization_id:null};const {data,error}=await db.from('facilities').insert(row).select().single();if(error)throw error;facilities.push(data);facilityById.set(data.id,data);addMarkers([data]);$('facilityModal').classList.remove('open');renderList(facilities,`${facilities.length} facilities`);focusFacility(data.id);toast('Facility added successfully.')}catch(err){console.error(err);toast(err.message||'Could not add facility.',false)}finally{btn.disabled=false;btn.textContent='Save facility'}};
function openAuth(){$('authModal').classList.add('open')}$('authBtn').onclick=()=>currentUser?logout():openAuth();$('toggleAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';$('authTitle').textContent=authMode==='login'?'Sign in':'Create account';$('authSubmit').textContent=authMode==='login'?'Sign in':'Create account';$('toggleAuth').textContent=authMode==='login'?'Create account':'Back to sign in'};$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value,b=$('authSubmit');b.disabled=true;try{if(authMode==='login'){const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;if(data.user){toast('Signed in successfully.');$('authModal').classList.remove('open')}}else{const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin}});if(error)throw error;if(data.session){toast('Account created and signed in.');$('authModal').classList.remove('open')}else toast('Account created. Check your email to confirm it, then sign in.')}}catch(err){toast(err.message||'Authentication failed.',false)}finally{b.disabled=false}};async function logout(){await db.auth.signOut();toast('Signed out.')}function updateAuth(session){currentUser=session?.user||null;$('account').textContent=currentUser?currentUser.email:'';$('authBtn').textContent=currentUser?'Sign out':'Sign in'}db.auth.onAuthStateChange((_e,s)=>updateAuth(s));
db.channel('facility-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'facilities'},payload=>{const f=payload.new;if(!f.public_visible)return;if(!facilityById.has(f.id)){facilities.push(f);facilityById.set(f.id,f);addMarkers([f]);renderList(facilities,`${facilities.length} facilities`);toast('New facility added to the map.')}}).subscribe();
(async()=>{try{const {data}=await db.auth.getSession();updateAuth(data.session)}catch(e){console.error(e)}await loadFacilities()})();
</script></body></html>
