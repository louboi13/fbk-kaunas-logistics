<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#101827" />
<title>FBK KAUNAS LOGISTICS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f7fb;color:#18202a}#app{height:100%;display:flex;flex-direction:column}.top{height:64px;background:#101827;color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;z-index:1000}.brand{font-weight:800;letter-spacing:.5px;white-space:nowrap}.status{font-size:12px;opacity:.75}.top .spacer{flex:1}.btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.primary{background:#2563eb;color:#fff}.btn.light{background:#fff;color:#172033}.side{width:390px;background:#fff;border-right:1px solid #dfe4ec;display:flex;flex-direction:column;z-index:900}.layout{flex:1;min-height:0;display:flex}.search{padding:14px;border-bottom:1px solid #e5e7eb}.search input{width:100%;padding:12px 13px;border:1px solid #cfd6e2;border-radius:10px;outline:none}.hint{font-size:12px;color:#64748b;margin-top:8px}.list{overflow:auto;flex:1;padding:8px}.card{border:1px solid #e1e7ef;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;background:#fff}.card:hover{border-color:#2563eb;box-shadow:0 2px 10px #0000000d}.card h3{font-size:14px;margin:0 0 5px}.muted{color:#64748b;font-size:12px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8eefc;color:#1d4ed8;font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:6px}.empty{padding:24px;text-align:center;color:#64748b;font-size:13px}.mapwrap{flex:1;min-width:0;position:relative}.map{height:100%;width:100%}.floating{position:absolute;top:14px;right:14px;z-index:800;background:#fff;border-radius:12px;box-shadow:0 5px 22px #0002;padding:10px;display:flex;gap:8px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:2000;padding:18px}.modal.open{display:flex}.dialog{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:16px;box-shadow:0 20px 70px #0005;padding:20px}.dialog h2{margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#475569}.field input,.field select,.field textarea{border:1px solid #cfd6e2;border-radius:9px;padding:10px}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.close{float:right;border:0;background:#eef2f7;border-radius:8px;padding:6px 9px;cursor:pointer}.account{font-size:12px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast{position:fixed;bottom:18px;right:18px;background:#111827;color:#fff;padding:12px 15px;border-radius:10px;z-index:3000;display:none;max-width:380px}.toast.show{display:block}.leaflet-popup-content-wrapper{border-radius:12px}.popup h3{margin:0 0 6px}.popup p{margin:4px 0;font-size:12px}.smallbtn{border:0;background:#2563eb;color:#fff;border-radius:7px;padding:6px 9px;cursor:pointer;margin-top:7px}@media(max-width:680px){.layout{flex-direction:column}.side{width:100%;height:42%;border-right:0;border-bottom:1px solid #dfe4ec}.mapwrap{height:58%}.account{display:none}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="brand">FBK KAUNAS LOGISTICS</div><div class="status" id="status">Connecting…</div><div class="spacer"></div><div class="account" id="account"></div><button class="btn light" id="authBtn">Sign in</button><button class="btn primary" id="addBtn">+ Add Facility</button></header>
<div class="layout"><aside class="side"><div class="search"><input id="search" placeholder="Search facility name or address…" autocomplete="off"><div class="hint">Click a result to zoom the map directly to the facility.</div></div><div class="list" id="list"><div class="empty">Loading facilities…</div></div></aside><main class="mapwrap"><div id="map" class="map"></div><div class="floating"><button class="btn light" id="usaBtn">🇺🇸 USA</button><button class="btn primary" id="locateBtn">◎ My location</button></div></main></div></div>
<div class="modal" id="facilityModal"><div class="dialog"><button class="close" data-close="facilityModal">✕</button><h2>Add shipping / receiving facility</h2><form id="facilityForm"><div class="grid"><div class="field full"><label>Facility name *</label><input name="name" required placeholder="Example: Walmart Distribution Center"></div><div class="field"><label>Type *</label><select name="facility_type"><option value="shipper">Shipper</option><option value="receiver">Receiver</option><option value="both">Shipper + Receiver</option></select></div><div class="field"><label>ZIP</label><input name="zip" placeholder="75001"></div><div class="field full"><label>Street address *</label><input name="address" required placeholder="123 Main St"></div><div class="field"><label>City</label><input name="city" placeholder="Dallas"></div><div class="field"><label>State</label><input name="state_code" maxlength="2" placeholder="TX"></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Hours</label><input name="hours" placeholder="Mon-Fri 06:00-22:00"></div><div class="field"><label>Parking</label><input name="parking"></div><div class="field"><label>Lumper</label><input name="lumper"></div><div class="field"><label>Appointment</label><input name="appointment"></div><div class="field"><label>Average wait (min)</label><input name="average_wait_minutes" type="number" min="0"></div><div class="field full"><label>Driver notes</label><textarea name="driver_instructions" placeholder="Gate instructions, check-in, dock info, important driver notes…"></textarea></div></div><div class="actions"><button type="button" class="btn light" data-close="facilityModal">Cancel</button><button class="btn primary" type="submit">Save facility</button></div></form></div></div>
<div class="modal" id="authModal"><div class="dialog"><button class="close" data-close="authModal">✕</button><h2 id="authTitle">Sign in</h2><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div class="actions"><button type="button" class="btn light" id="toggleAuth">Create account</button><button class="btn primary" type="submit" id="authSubmit">Sign in</button></div></form><div class="hint" id="authHint">Accounts are optional for browsing and adding public facilities.</div></div></div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://ynjfvtezearvynmvmmvo.supabase.co',SUPABASE_KEY='sb_publishable_QW_rJUJ_8XrTytm4aUbbaw_397_7H0t',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let facilities=[],markers=new Map(),currentUser=null,authMode='login';
const map=L.map('map').setView([39.8,-98.6],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const icon=L.divIcon({className:'',html:'<div style="width:16px;height:16px;background:#2563eb;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px #0006"></div>',iconSize:[16,16],iconAnchor:[8,8]});
function toast(msg,good=true){const t=$('toast');t.textContent=msg;t.style.background=good?'#111827':'#991b1b';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4000)}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function address(f){return [f.address,f.city,f.state_code,f.zip].filter(Boolean).join(', ')}function typeLabel(t){return t==='both'?'Shipper + Receiver':t.charAt(0).toUpperCase()+t.slice(1)}
function popup(f){return `<div class="popup"><h3>${esc(f.name)}</h3><p><b>${esc(typeLabel(f.facility_type))}</b></p><p>${esc(address(f))}</p>${f.phone?`<p>☎ ${esc(f.phone)}</p>`:''}${f.hours?`<p>Hours: ${esc(f.hours)}</p>`:''}${f.parking?`<p>Parking: ${esc(f.parking)}</p>`:''}${f.lumper?`<p>Lumper: ${esc(f.lumper)}</p>`:''}${f.average_wait_minutes?`<p>Avg wait: ${esc(f.average_wait_minutes)} min</p>`:''}${f.driver_instructions?`<p><b>Driver notes:</b> ${esc(f.driver_instructions)}</p>`:''}<button class="smallbtn" onclick="focusFacility('${f.id}')">Open facility</button></div>`}
function render(){const q=$('search').value.trim().toLowerCase(),rows=facilities.filter(f=>!q||[f.name,address(f),f.city,f.state_code,f.zip,f.facility_type].join(' ').toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(f=>`<div class="card" onclick="focusFacility('${f.id}')"><span class="pill">${esc(typeLabel(f.facility_type))}</span><h3>${esc(f.name)}</h3><div class="muted">${esc(address(f))}</div>${f.driver_instructions?`<div class="muted" style="margin-top:6px">${esc(f.driver_instructions.slice(0,120))}${f.driver_instructions.length>120?'…':''}</div>`:''}</div>`).join(''):'<div class="empty">No facilities found.</div>'}
function drawMarkers(){markers.forEach(m=>m.remove());markers.clear();facilities.forEach(f=>{if(!Number.isFinite(+f.latitude)||!Number.isFinite(+f.longitude))return;const m=L.marker([+f.latitude,+f.longitude],{icon}).addTo(map).bindPopup(popup(f));markers.set(f.id,m)})}window.focusFacility=function(id){const f=facilities.find(x=>x.id===id);if(!f)return;if(Number.isFinite(+f.latitude)&&Number.isFinite(+f.longitude)){map.flyTo([+f.latitude,+f.longitude],16,{duration:.8});const m=markers.get(f.id);if(m)setTimeout(()=>m.openPopup(),700)}else toast('This facility does not have coordinates yet.',false)};
async function loadFacilities(){ $('status').textContent='Loading facilities…';const {data,error}=await db.from('facilities').select('id,name,facility_type,address,city,state_code,zip,phone,hours,parking,lumper,appointment,average_wait_minutes,driver_instructions,latitude,longitude,public_visible,created_at').order('name').limit(10000);if(error){console.error(error);$('status').textContent='Database error';toast('Could not load facilities: '+error.message,false);$('list').innerHTML='<div class="empty">Database connection failed.</div>';return}facilities=data||[];drawMarkers();render();$('status').textContent=`${facilities.length} facilities`}
async function geocode(query){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(query),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('Geocoding service unavailable');const a=await r.json();if(!a.length)throw new Error('Address not found. Enter a more complete US address.');return{lat:+a[0].lat,lon:+a[0].lon}}
$('search').oninput=render;$('usaBtn').onclick=()=>map.flyTo([39.8,-98.6],4,{duration:.7});$('locateBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>map.flyTo([p.coords.latitude,p.coords.longitude],13),()=>toast('Location permission was not granted.',false)):toast('Geolocation is not available.',false);$('addBtn').onclick=()=>{$('facilityModal').classList.add('open');$('facilityForm').reset()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('open'));window.onclick=e=>{if(e.target.classList.contains('modal'))e.target.classList.remove('open')};
$('facilityForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries()),btn=e.target.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Finding address…';try{const g=await geocode([v.address,v.city,v.state_code,v.zip,'USA'].filter(Boolean).join(', '));const row={name:v.name.trim(),facility_type:v.facility_type,address:v.address.trim(),city:v.city?.trim()||null,state_code:v.state_code?.trim().toUpperCase()||null,zip:v.zip?.trim()||null,phone:v.phone?.trim()||null,hours:v.hours?.trim()||null,parking:v.parking?.trim()||null,lumper:v.lumper?.trim()||null,appointment:v.appointment?.trim()||null,average_wait_minutes:v.average_wait_minutes?Number(v.average_wait_minutes):null,driver_instructions:v.driver_instructions?.trim()||null,latitude:g.lat,longitude:g.lon,public_visible:true,created_by:currentUser?.id||null,organization_id:null};const {data,error}=await db.from('facilities').insert(row).select().single();if(error)throw error;facilities.push(data);drawMarkers();render();$('facilityModal').classList.remove('open');focusFacility(data.id);toast('Facility added successfully.')}catch(err){console.error(err);toast(err.message||'Could not add facility.',false)}finally{btn.disabled=false;btn.textContent='Save facility'}};
function openAuth(){$('authModal').classList.add('open')}$('authBtn').onclick=()=>currentUser?logout():openAuth();$('toggleAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';$('authTitle').textContent=authMode==='login'?'Sign in':'Create account';$('authSubmit').textContent=authMode==='login'?'Sign in':'Create account';$('toggleAuth').textContent=authMode==='login'?'Create account':'Back to sign in'};$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value,b=$('authSubmit');b.disabled=true;try{if(authMode==='login'){const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;if(data.user){toast('Signed in successfully.');$('authModal').classList.remove('open')}}else{const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin}});if(error)throw error;if(data.session){toast('Account created and signed in.');$('authModal').classList.remove('open')}else toast('Account created. Check your email to confirm it, then sign in.')}}catch(err){toast(err.message||'Authentication failed.',false)}finally{b.disabled=false}};async function logout(){await db.auth.signOut();toast('Signed out.')}function updateAuth(session){currentUser=session?.user||null;$('account').textContent=currentUser?currentUser.email:'';$('authBtn').textContent=currentUser?'Sign out':'Sign in'}db.auth.onAuthStateChange((_e,s)=>updateAuth(s));(async()=>{try{const {data}=await db.auth.getSession();updateAuth(data.session)}catch(e){console.error(e)}await loadFacilities()})();
</script></body></html>
